<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PageForge fixture: delayed selector</title>
  </head>
  <body>
    <h1>Selector fixture</h1>
    <p id="always">always visible</p>
    <div id="ready" style="display: none">selector ready content</div>
    <script>
      setTimeout(function () {
        document.getElementById("ready").style.display = "block";
      }, 400);
    </script>
  </body>
</html>
