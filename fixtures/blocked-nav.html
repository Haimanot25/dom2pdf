<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocked scripted navigation fixture</title>
  </head>
  <body>
    <h1>Blocked scripted navigation fixture</h1>
    <p>
      After 300ms this page attempts to navigate the main frame to the
      link-local metadata endpoint. The request guard must abort the
      navigation and the conversion must fail with a typed policy error.
    </p>
    <script>
      setTimeout(function () {
        window.location.href = "http://169.254.169.254/latest/";
      }, 300);
    </script>
  </body>
</html>
