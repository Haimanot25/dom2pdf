<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dom2pdf fixture: polling network</title>
  </head>
  <body>
    <h1>Polling fixture</h1>
    <p>This page never stops talking to the network.</p>
    <script>
      // Requests overlap (50ms interval, 100ms server delay), so there is
      // never a quiet window. Readiness must fail on its deadline, not hang.
      setInterval(function () {
        fetch("__delay/100/poll.png").catch(function () {});
      }, 50);
    </script>
  </body>
</html>
