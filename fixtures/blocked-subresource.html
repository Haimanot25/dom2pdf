<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocked subresource fixture</title>
  </head>
  <body>
    <h1>Blocked subresource fixture</h1>
    <p>
      This page itself is served from loopback (allowed with
      <code>security.allowLoopback</code>), but it embeds two private-address
      subresources that the destination policy must reject at the network
      layer: an RFC1918 host and the link-local metadata endpoint.
    </p>
    <img src="http://10.0.0.1/internal.png" alt="internal asset" />
    <img src="http://169.254.169.254/latest/meta-data/" alt="cloud metadata" />
  </body>
</html>
